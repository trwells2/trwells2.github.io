const NUMERIC_FIELDS = new Set([
  "id", "ts", "shot_number", "hole",
  "ball_speed", "club_speed", "carry", "total_dist", "offline",
  "peak_height", "desc_angle", "hla", "vla",

]);

function parseCellValue(field, raw) {
  if (raw === undefined || raw === null || raw === "") return undefined;
  if (NUMERIC_FIELDS.has(field)) {
    const n = Number(raw);
    if (!isNaN(n)) return n;
    // ts might be a date string — try Date.parse, return seconds
    if (field === "ts") {
      const t = Date.parse(raw);
      if (!isNaN(t)) return t / 1000;
    }
    return undefined;
  }
  return String(raw);
}

async function fetchSheetData() {
  const { SHEET_ID, API_KEY, RANGE } = CONFIG;
  if (SHEET_ID.startsWith("PASTE") || API_KEY.startsWith("PASTE")) {
    throw new Error("Configure SHEET_ID and API_KEY at the top of dashboard.html");
  }
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(RANGE)}?key=${API_KEY}`;
  const res = await fetch(url);
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`Sheets API ${res.status}: ${txt}`);
  }
  const data = await res.json();
  const rows = data.values || [];
  if (rows.length < 2) throw new Error("Sheet has no data rows");

  const headers = rows[0];
  const dataRows = rows.slice(1);

  const shots = dataRows.map((row, i) => {
    const shot = {};
    headers.forEach((header, colIdx) => {
      const trimmed = String(header).trim();
      const targetField = COLUMN_MAP[trimmed];
      if (!targetField) return;
      const parsed = parseCellValue(targetField, row[colIdx]);
      if (parsed !== undefined) shot[targetField] = parsed;
    });
    if (shot.id === undefined) shot.id = i + 1;
    if (shot.source === undefined) shot.source = "google_sheet";
    return shot;
  }).filter(s => s.club && s.ts !== undefined);

  return shots;
}
